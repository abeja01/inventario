<div class="flex h-screen w-screen overflow-hidden bg-black text-gray-200 font-sans relative">

  <!-- Sidebar component -->
  <app-sidebar class="hidden md:flex h-full select-none shrink-0 z-10"></app-sidebar>

  <!-- Right pane container (Header + Main content) -->
  <div class="flex flex-col flex-1 h-full overflow-hidden min-w-0 z-10 relative">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-8 py-5 bg-neutral-900/40 backdrop-blur-md border-b border-neutral-800">
      
      <!-- Left side header: Mobile brand / breadcrumb -->
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar toggle -->
        <button class="md:hidden w-10 h-10 rounded-xl bg-neutral-900 border border-neutral-700 flex items-center justify-center text-gray-400 hover:text-gray-100">
          <span class="material-symbols-outlined">menu</span>
        </button>
        
        <div class="hidden sm:block">
          <div class="flex items-center gap-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest">
            <span>Sistema</span>
            <span class="material-symbols-outlined text-[10px]">chevron_right</span>
            <span class="text-white">Panel Principal</span>
          </div>
          <h2 class="text-xs text-gray-400 font-bold mt-0.5 sm:hidden">Control Panel</h2>
        </div>
      </div>

      <!-- Right side header: user profiles & details -->
      <div class="flex items-center gap-6">
        <!-- Date display mockup -->
        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-neutral-900 border border-neutral-700 text-xs font-semibold text-gray-300">
          <span class="material-symbols-outlined text-sm">calendar_month</span>
          <span>19 de Mayo, 2026</span>
        </div>

        <!-- Notification Bell -->
        <button class="relative w-10 h-10 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 flex items-center justify-center text-gray-400 hover:text-gray-100 transition-all duration-300 cursor-pointer">
          <span class="material-symbols-outlined text-xl">notifications</span>
          <span class="absolute top-2 right-2 w-2 h-2 bg-gray-100 rounded-full border border-black"></span>
        </button>

        <!-- Profile container -->
        <div class="flex items-center gap-3 pl-4 border-l border-neutral-800">
          <div class="text-right hidden sm:block">
            <h4 class="font-bold text-xs text-gray-200">Usuario Administrador</h4>
            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-wider">Dirección Ejecutiva</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-neutral-700 p-[1px] shadow-sm">
            <div class="w-full h-full rounded-[10px] bg-black flex items-center justify-center font-bold text-xs text-white">
              AD
            </div>
          </div>
        </div>

      </div>

    </header>

    <!-- Main Content view -->
    <main class="flex-1 p-6 md:p-8 overflow-y-auto custom-scrollbar bg-transparent">
      <div class="max-w-7xl mx-auto h-full">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
