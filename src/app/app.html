<div class="flex h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 font-sans">
  <!-- Glowing visual background decorations -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none select-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-rose-500/10 rounded-full blur-[120px] pointer-events-none select-none"></div>
  <div class="absolute top-[30%] right-[20%] w-[30%] h-[30%] bg-amber-500/5 rounded-full blur-[100px] pointer-events-none select-none"></div>

  <!-- Sidebar component -->
  <app-sidebar class="hidden md:flex h-full select-none shrink-0 z-10"></app-sidebar>

  <!-- Right pane container (Header + Main content) -->
  <div class="flex flex-col flex-1 h-full overflow-hidden min-w-0 z-10 relative">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-8 py-5 bg-slate-900/30 backdrop-blur-md border-b border-slate-800/80">
      
      <!-- Left side header: Mobile brand / breadcrumb -->
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar toggle (Mockup or responsive sidebar icon) -->
        <button class="md:hidden w-10 h-10 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-slate-200">
          <span class="material-symbols-outlined">menu</span>
        </button>
        
        <div class="hidden sm:block">
          <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 uppercase tracking-widest">
            <span>Sistema</span>
            <span class="material-symbols-outlined text-xs">chevron_right</span>
            <span class="text-amber-500">Restaurante</span>
          </div>
          <h2 class="text-xs text-slate-400 font-semibold mt-0.5 sm:hidden">GustoStock Control Panel</h2>
        </div>
      </div>

      <!-- Right side header: user profiles & details -->
      <div class="flex items-center gap-6">
        <!-- Date display mockup -->
        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900/50 border border-slate-800/50 text-xs font-semibold text-slate-400">
          <span class="material-symbols-outlined text-sm text-amber-500">calendar_month</span>
          <span>19 de Mayo, 2026</span>
        </div>

        <!-- Notification Bell -->
        <button class="relative w-10 h-10 rounded-xl bg-slate-900/60 hover:bg-slate-900/90 border border-slate-800/80 flex items-center justify-center text-slate-400 hover:text-slate-200 hover:scale-105 transition-all duration-300 cursor-pointer">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-rose-500 rounded-full border border-slate-950"></span>
        </button>

        <!-- Profile container -->
        <div class="flex items-center gap-3 pl-4 border-l border-slate-850/80">
          <div class="text-right hidden sm:block">
            <h4 class="font-bold text-xs text-slate-200">Chef Principal</h4>
            <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider">Administrador</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 p-[1.5px] shadow-lg shadow-rose-500/10">
            <div class="w-full h-full rounded-[10px] bg-slate-900 flex items-center justify-center font-bold text-xs text-white">
              CP
            </div>
          </div>
        </div>

      </div>

    </header>

    <!-- Main Content view -->
    <main class="flex-1 p-6 md:p-8 overflow-y-auto custom-scrollbar bg-slate-950/20">
      <div class="max-w-7xl mx-auto h-full">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
