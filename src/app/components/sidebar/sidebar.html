<aside class="flex flex-col w-64 h-full bg-neutral-900 border-r border-neutral-800 p-6 select-none shrink-0">
  <!-- Brand logo -->
  <div class="flex items-center gap-3 mb-10 px-2">
    <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-black shadow-sm text-white">
      <span class="material-symbols-outlined font-bold text-xl">inventory</span>
    </div>
    <div>
      <h1 class="font-bold text-xl tracking-widest text-white">
        SISTEMA
      </h1>
      <p class="text-[9px] font-bold uppercase tracking-widest text-gray-500">
        Gestión
      </p>
    </div>
  </div>

  <!-- Navigation items -->
  <nav class="flex-1 space-y-2">
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path"
         routerLinkActive="bg-neutral-800 border-l-2 border-white text-white"
         [routerLinkActiveOptions]="{exact: link.path === '/dashboard'}"
         class="flex items-center gap-4 px-4 py-3.5 rounded-xl border border-transparent text-gray-400 hover:text-white hover:bg-neutral-800 transition-all duration-300 group">
        <span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform duration-300">
          {{ link.icon }}
        </span>
        <span class="font-bold text-xs tracking-wide">
          {{ link.label }}
        </span>
      </a>
    }
  </nav>

  <!-- Bottom quick info card -->
  <div class="mt-auto pt-6 border-t border-neutral-800">
    <div class="relative overflow-hidden rounded-2xl bg-black border border-neutral-700 p-4 shadow-sm">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined text-gray-400 mt-0.5 text-lg">info</span>
        <div>
          <h4 class="font-bold text-xs text-gray-200">Estado de Red</h4>
          <p class="text-[10px] text-gray-500 mt-1 leading-relaxed">
            Firebase: Esperando credenciales.
          </p>
          <div class="flex items-center gap-1.5 mt-3">
            <span class="relative flex h-1.5 w-1.5">
              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-gray-500"></span>
            </span>
            <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">
              En Espera
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
