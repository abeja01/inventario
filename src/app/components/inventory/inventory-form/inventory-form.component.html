<div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4 mb-6">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-sm font-bold text-white uppercase tracking-widest">
      {{ selectedItem() ? 'Editar Producto' : 'Agregar Nuevo Producto' }}
    </h3>
    @if(selectedItem()) {
      <button (click)="cancelEdit()" class="text-xs text-gray-400 hover:text-white underline">
        Cancelar Edición
      </button>
    }
  </div>
  
  <form (ngSubmit)="onSubmit()" #form="ngForm" class="flex flex-col md:flex-row gap-4 items-end">
    <div class="flex-1 w-full flex flex-col md:flex-row gap-4">
      <div class="flex-1">
        <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Nombre</label>
        <input 
          type="text" 
          [(ngModel)]="formData.name" 
          name="name" 
          required
          class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-white transition-colors"
          placeholder="Ej. Producto de prueba"
        >
      </div>

      <div class="flex-1">
        <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Categoría</label>
        <select 
          [(ngModel)]="formData.category" 
          name="category" 
          required
          class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-white transition-colors"
        >
          <option value="" disabled selected>Selecciona...</option>
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.name">{{ cat.name }}</option>
          }
        </select>
      </div>
    </div>
    
    <div class="w-full md:w-24">
      <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Cant.</label>
      <input 
        type="number" 
        [(ngModel)]="formData.quantity" 
        name="quantity" 
        required min="1"
        class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-white transition-colors"
      >
    </div>

    <div class="w-full md:w-32">
      <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Precio ($)</label>
      <input 
        type="number" 
        [(ngModel)]="formData.price" 
        name="price" 
        required min="0" step="0.01"
        class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-white transition-colors"
      >
    </div>

    <button 
      type="submit" 
      [disabled]="!form.valid"
      class="w-full md:w-auto bg-white hover:bg-gray-200 text-black font-bold py-2 px-6 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
      {{ selectedItem() ? 'Actualizar' : 'Agregar' }}
    </button>
  </form>
</div>
